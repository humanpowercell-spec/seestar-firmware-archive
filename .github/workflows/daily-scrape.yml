name: daily-scrape

on:
  schedule:
    - cron: "17 6 * * *"        # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated versions to force-process (blank = auto-diff)"
        required: false
        default: ""
      rescan:
        description: "Reprocess versions already in the inventory"
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape + publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ARGS="--push --commitish ${GITHUB_REF_NAME}"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          [ "${{ github.event.inputs.rescan }}" = "true" ] && ARGS="$ARGS --rescan"
          python scripts/scrape.py $ARGS

      - name: Summary
        if: always()
        run: cat HISTORY.md >> "$GITHUB_STEP_SUMMARY" || true
