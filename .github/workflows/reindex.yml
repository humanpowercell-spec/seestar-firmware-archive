name: reindex

# Rebuild inventory/ + HISTORY.md from whatever app/* releases currently exist
# and commit the result. Safe to run any time — pure function of the releases.

on:
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild inventory from releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/reindex.py --push --branch "${GITHUB_REF_NAME}"
      - name: Summary
        if: always()
        run: cat HISTORY.md >> "$GITHUB_STEP_SUMMARY" || true
