name: seed

# One-time / catch-up backfill: one runner per pending app version so no single
# machine downloads every XAPK. The version jobs only create releases; a final
# `reindex` job is the sole writer of the in-repo inventory. Safe to re-run —
# versions whose release already has its assets are cheap to redo (idempotent).

on:
  workflow_dispatch:

concurrency:
  group: scrape          # shares the lock with daily-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/seed.py --emit-matrix

  seed:
    needs: plan
    if: fromJson(needs.plan.outputs.matrix).version[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish release for ${{ matrix.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scrape.py --only "${{ matrix.version }}" --push --no-commit

  reindex:
    needs: seed
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild inventory from releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/reindex.py --push --branch "${GITHUB_REF_NAME}"
      - name: Summary
        if: always()
        run: cat HISTORY.md >> "$GITHUB_STEP_SUMMARY" || true
